upstream georally_backend {
    server server:3001;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_accept_language $detected_lang {
    default "en";
    "~*^ru"  "ru";
    "~*^uz"  "uz";
    "~*^en"  "en";
}

server {
    listen 80;
    server_name georally.world www.georally.world;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://georally.world$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.georally.world;

    ssl_certificate     /etc/letsencrypt/live/georally.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/georally.world/privkey.pem;

    return 301 https://georally.world$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name georally.world;

    ssl_certificate     /etc/letsencrypt/live/georally.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/georally.world/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;

    location /socket.io/ {
        proxy_pass http://georally_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Socket.IO pings every 25s by default, well inside
        # nginx's normal 60s timeout; this is just a generous margin so a
        # quiet moment between quiz questions never gets treated as idle.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://georally_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://georally_backend;
        proxy_set_header Host $host;
    }

    # Pre-gzipped on disk, so nginx must NOT try to compress it again 
    # (gzip off) or the bytes get corrupted.
    location ~* ^/map/tiles/.*\.pbf$ {
        default_type application/x-protobuf;
        add_header Content-Encoding gzip always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip off;
        try_files $uri =404;
    }

    location ~* ^/map/fonts/.*\.pbf$ {
        default_type application/x-protobuf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Vite's hashed filenames mean the content changes only when the
    # filename does; safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache" always;
        return 302 /$detected_lang/;
    }

    location ~ ^/(en|ru|uz)(/.*)?$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri /locales/$1.html =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

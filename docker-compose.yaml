services:
   server:
      build:
         context: .
         dockerfile: apps/server/Dockerfile
      restart: unless-stopped
      environment:
         - NODE_ENV=production
         - PORT=3001
         - CORS_ORIGIN=https://georally.world
      expose:
         - '3001'
      logging:
         driver: json-file
         options:
            max-size: 10m
            max-file: '5'

   nginx:
      build:
         context: .
         dockerfile: apps/web/Dockerfile
      restart: unless-stopped
      ports:
         - '80:80'
         - '443:443'
      volumes:
         - ./data/certbot/conf:/etc/letsencrypt:ro
         - ./data/certbot/www:/var/www/certbot
      depends_on:
         - server
      logging:
         driver: json-file
         options:
            max-size: 10m
            max-file: '5'

   certbot:
      image: certbot/certbot:latest
      restart: unless-stopped
      volumes:
         - ./data/certbot/conf:/etc/letsencrypt
         - ./data/certbot/www:/var/www/certbot
      entrypoint: >
         /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"
